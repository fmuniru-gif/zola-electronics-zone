name: Zola gallery full photo viewer review (NO DEPLOY)
on:
  push:
    branches: [review/zez-gallery-lightbox-20261031]
permissions:
  contents: read
jobs:
  gallery-viewer-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact baseline and review head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = b96668206ffbf311f51e827e1c5cd4d058c53933
          git merge-base --is-ancestor b96668206ffbf311f51e827e1c5cd4d058c53933 HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --test tests/zez-v2.test.cjs tests/zez-email-fix.test.cjs tests/zez-gallery-lightbox.test.cjs
      - run: node --test tests/zez-gallery-static-serving.test.cjs
      - run: npm run test:browser
      - run: node --test --test-concurrency=1 tests/zez-email-fix.browser.cjs tests/zez-gallery-lightbox.browser.cjs
      - name: Ensure no generated changes
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
